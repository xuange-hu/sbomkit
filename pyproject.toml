[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbomkit"
version = "0.1.0"
description = "Zero-dependency supply-chain vet for lockfiles: SBOM (CycloneDX + SPDX), SPDX license policy solving, manifest/lock drift, typosquat detection, PR-gate SBOM diffs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xuange-hu" }]
keywords = ["sbom", "supply-chain", "cyclonedx", "spdx", "license", "lockfile", "security", "mcp", "sarif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2,<3"]

[project.urls]
Homepage = "https://github.com/xuange-hu/sbomkit"
Source = "https://github.com/xuange-hu/sbomkit"

[project.scripts]
sbomkit = "sbomkit.cli:main"
sbomkit-mcp = "sbomkit.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
