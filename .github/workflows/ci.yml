name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (no dependencies expected)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff

      - name: Zero runtime dependencies
        run: |
          python -c "import sbomkit, sbomkit.cli, sbomkit.mcp_server; print('imports ok without extras')"

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest

      - name: CLI smoke
        run: |
          sbomkit rules | head -5
          sbomkit check | head -3
          sbomkit demo --dir /tmp/sbomkit-demo | tail -25

      - name: Badge count matches pytest collection (warning only)
        run: |
          collected=$(python -m pytest --collect-only 2>/dev/null | tail -1 | grep -oE '[0-9]+' | head -1)
          badge=$(grep -oE 'tests-[0-9]+' README.md | head -1 | grep -oE '[0-9]+')
          echo "collected=$collected badge=$badge"
          if [ -n "$badge" ] && [ "$collected" != "$badge" ]; then
            echo "::warning::README badge says $badge but pytest collects $collected"
          fi

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install with the mcp extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[mcp]' pytest
      - name: MCP server builds and registers tools
        run: |
          python - <<'PY'
          from sbomkit.mcp_server import build_server, tool_manifest
          import asyncio
          server = build_server()
          tools = asyncio.run(server.list_tools())
          names = {t.name for t in tools}
          expected = {t["name"] for t in tool_manifest()}
          assert names == expected, (names, expected)
          print("MCP tools:", sorted(names))
          PY
